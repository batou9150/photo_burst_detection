[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "photo_burst_detection"
dynamic = ["version"]
description = "Flask App for photo burst detection"
readme = "README.md"
authors = [{ name = "batou9150" }]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "flask>=3.1,<4",
    "flask-login>=0.6.3,<0.7",
    "flask-ldap3-login>=1.0.2,<2",
    "flask-wtf>=1.3,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: Flask",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.urls]
Homepage = "https://github.com/batou9150/photo_burst_detection"

[tool.setuptools.packages.find]
include = ["photo_burst_detection*"]

[tool.setuptools.package-data]
photo_burst_detection = ["static/*", "templates/*"]

[tool.setuptools_scm]
# version comes from the release tag, e.g. v1.4.3 -> 1.4.3

[tool.pytest.ini_options]
testpaths = ["tests"]
